<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VetUni - Pedido Confirmado</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }
        
        .app-container {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .confirmation-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            background: var(--white);
            border-radius: var(--border-radius-2xl);
            box-shadow: var(--shadow-md);
            overflow-x: hidden;
            text-align: center;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--success-color), #66BB6A);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            color: var(--white);
            animation: bounce 0.6s ease;
        }
        
        .confirmation-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--gray-900);
            margin-bottom: 1rem;
        }
        
        .confirmation-message {
            font-size: var(--font-size-lg);
            color: var(--gray-600);
            margin-bottom: 2rem;
        }
        
        .order-details {
            background: var(--gray-50);
            border-radius: var(--border-radius-xl);
            padding: 2rem;
            margin: 2rem 0;
            text-align: left;
        }
        
        .order-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--gray-200);
        }
        
        .order-detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: var(--font-weight-semibold);
            color: var(--gray-700);
        }
        
        .detail-value {
            color: var(--gray-900);
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius-lg);
            font-weight: var(--font-weight-semibold);
            text-decoration: none;
            transition: all var(--transition-normal);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: var(--white);
        }
        
        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-800);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        /* ========== RESPONSIVE DESIGN ========== */
        @media (max-width: 768px) {
            .confirmation-container {
                padding: 1.5rem !important;
                margin: 0.5rem auto !important;
            }
            
            .confirmation-title {
                font-size: var(--font-size-2xl) !important;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <script src="../../assets/js/api.service.js"></script>
    
    <div class="app-container" style="padding-top: 2rem; min-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch;">
        <div class="confirmation-container">
            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            
            <h1 class="confirmation-title">¡Pedido Confirmado!</h1>
            <p class="confirmation-message">Tu pedido ha sido procesado exitosamente</p>
            
            <div class="order-details" id="orderDetails">
                <!-- Los detalles se cargarán dinámicamente -->
            </div>
            
            <div class="action-buttons">
                <a href="./index.html" class="action-btn btn-primary">
                    <i class="fa-solid fa-home"></i> Volver al Inicio
                </a>
                <a href="../catalog/index.html" class="action-btn btn-secondary">
                    <i class="fa-solid fa-store"></i> Seguir Comprando
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // Obtener ID del pedido de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        
        if (orderId) {
            // Cargar pedido desde localStorage
            const orders = JSON.parse(localStorage.getItem('vetuni_orders') || '[]');
            const order = orders.find(o => o.id == orderId);
            
            if (order) {
                const orderDetails = document.getElementById('orderDetails');
                const paymentMethodText = order.metodoPago === 'local' 
                    ? 'Pago en el Local' 
                    : 'Tarjeta de Crédito/Débito';
                
                orderDetails.innerHTML = `
                    <div class="order-detail-row">
                        <span class="detail-label">Número de Pedido:</span>
                        <span class="detail-value">#${order.id}</span>
                    </div>
                    <div class="order-detail-row">
                        <span class="detail-label">Fecha:</span>
                        <span class="detail-value">${new Date(order.fecha).toLocaleDateString('es-ES', { 
                            year: 'numeric', 
                            month: 'long', 
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        })}</span>
                    </div>
                    <div class="order-detail-row">
                        <span class="detail-label">Método de Pago:</span>
                        <span class="detail-value">${paymentMethodText}</span>
                    </div>
                    <div class="order-detail-row">
                        <span class="detail-label">Total:</span>
                        <span class="detail-value" style="font-size: 1.25rem; font-weight: 700; color: var(--primary-color);">
                            $${order.total.toFixed(2)}
                        </span>
                    </div>
                    ${order.metodoPago === 'local' ? `
                    <div style="margin-top: 1.5rem; padding: 1rem; background: linear-gradient(135deg, #E8F5E9, #F1F8F4); border-radius: 12px; border: 2px solid var(--primary-color);">
                        <p style="color: var(--primary-dark); font-weight: 600; margin-bottom: 0.5rem;">
                            <i class="fa-solid fa-info-circle"></i> Información Importante
                        </p>
                        <p style="color: var(--gray-700); font-size: 0.9rem;">
                            Tu pedido está pendiente de pago. Podrás pagar cuando retires tus productos en el local.
                        </p>
                    </div>
                    ` : ''}
                `;
            }
        }
    </script>
</body>
</html>
